name: Public evaluation suite

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e . ruff
      - name: Run Ruff
        run: python -m ruff check rag_quality_lab tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify JSONL demo round trip
        run: |
          python -m rag_quality_lab demo --output "$RUNNER_TEMP/ci-demo"
          python -m rag_quality_lab retrieval \
            --gold evaluation/datasets/rag_gold_v1.jsonl \
            --run "$RUNNER_TEMP/ci-demo-run.jsonl" \
            --output "$RUNNER_TEMP/ci-round-trip"
      - name: Regenerate committed baselines
        run: |
          python -m rag_quality_lab intent \
            --gold evaluation/datasets/intent_v1.jsonl \
            --predictions evaluation/runs/deterministic_pipeline_v1.jsonl \
            --output reports/intent-regression-v1
          python -m rag_quality_lab intent \
            --gold evaluation/datasets/intent_v1.jsonl \
            --predictions evaluation/runs/deterministic_pipeline_v1.jsonl \
            --expected-field action \
            --predicted-field action \
            --output reports/action-regression-v1
          python -m rag_quality_lab contract \
            --gold evaluation/datasets/intent_v1.jsonl \
            --predictions evaluation/runs/deterministic_pipeline_v1.jsonl \
            --output reports/contract-regression-v1
          python -m rag_quality_lab retrieval \
            --gold evaluation/datasets/rag_gold_v1.jsonl \
            --run reports/synthetic-retrieval-v1-run.jsonl \
            --output reports/synthetic-retrieval-v1
          python -m rag_quality_lab answer \
            --gold evaluation/datasets/answer_gold_v1.jsonl \
            --answers evaluation/runs/answer_contract_fixture_v1.jsonl \
            --output reports/answer-contract-v1
          git diff --exit-code -- reports
      - name: Build and smoke-test wheel resources
        run: |
          python -m pip wheel . --no-deps --wheel-dir wheelhouse
          python -m pip install --force-reinstall wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          python -m rag_quality_lab demo --output wheel-demo
